[".config/nvim"]
    type = "git-repo"
    url = "https://github.com/bingo084/nvim-config.git"
    refreshPeriod = "12h"
[".config/ags"]
    type = "git-repo"
    url = "https://github.com/bingo084/ags-config.git"
    refreshPeriod = "12h"
["bin"]
    type = "git-repo"
    url = "https://github.com/bingo084/script.git"
    refreshPeriod = "168h"
[".config/bat/themes"]
    type = "archive"
    url = "{{ .github }}/catppuccin/bat/archive/main.zip"
    stripComponents = 2
    include = ["*/themes/*"]
    refreshPeriod = "168h"
[".config/btop/themes"]
    type = "archive"
    url = "{{ .github }}/catppuccin/btop/releases/latest/download/themes.tar.gz"
    stripComponents = 1
    refreshPeriod = "168h"
[".config/mihomo"]
    type = "git-repo"
    url = 'ssh://git@ssh.github.com:443/gist/{{ index (splitList "/" (rbwFields "Subscribe").MihomoConfig.value) 4 }}.git'
    refreshPeriod = "168h"
    clone.args = ["-c", "core.hooksPath=.githooks"]
[".config/git/themes/catppuccin.gitconfig"]
    type = "file"
    url = "{{ .githubRaw }}/catppuccin/delta/main/catppuccin.gitconfig"
    refreshPeriod = "168h"
[".face"]
    type = "file"
    url = 'https://gravatar.com/avatar/{{ sha256sum "bingo084@outlook.com" }}?s=2048'
    refreshPeriod = "168h"

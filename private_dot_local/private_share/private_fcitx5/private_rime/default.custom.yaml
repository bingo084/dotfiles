patch:
  schema_list:
    - schema: sbfd
    - schema: tiger_sentence
  switcher/caption: "〔方案选单〕"
  key_binder/bindings/+:
    - {accept: Control+p, send: Page_Up, when: has_menu}
    - {accept: Control+n, send: Page_Down, when: has_menu}
    - {accept: Up, send: Page_Up, when: has_menu}
    - {accept: Down, send: Page_Down, when: has_menu}
    - {accept: Control+b, send: Up, when: has_menu}
    - {accept: Control+f, send: Down, when: has_menu}
    - {accept: Left, send: Up, when: has_menu}
    - {accept: Right, send: Down, when: has_menu}

# 个人快捷键及虎整辅助功能：小鹤反查、统计、拆分、Emoji。
patch:
  engine/segmentors/@before 0: matcher
  engine/processors:
  - lua_processor@*zqj_stats_proc
  - lua_processor@tiger_sentence_ascii
  - lua_processor@*tiger_emoji_processor
  - recognizer
  - lua_processor@tiger_sentence_processor
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  schema/dependencies/+:
  - pinyin_simp
  - tiger_lookup
  recognizer/patterns/yin_add_user: ^`[A-Za-z']*$
  engine/segmentors/@before 2: affix_segmentor@yin_add_user
  engine/translators:
  - punct_translator
  - script_translator@yin_add_user
  - lua_translator@*tiger_yin_guard
  yin_add_user:
    tag: yin_add_user
    dictionary: pinyin_simp
    prefix: '`'
    tips: 〔小鹤反查〕
    initial_quality: -1
    enable_completion: true
    enable_user_dict: false
    enable_auto_phrase: false
    spelling_hints: 50
  engine/filters/+:
  - lua_filter@*tiger_yin_comment
  - lua_filter@*tiger_chaifen
  - lua_filter@*tiger_emoji
  - uniquifier
  switches/+:
  - name: tiger_stats_view
    reset: 0
    states: [查看统计, 查看统计]
  engine/translators/+:
  - lua_translator@*zqj_stats
  ascii_composer/switch_key:
    Shift_L: commit_text
    Shift_R: commit_code
  key_binder/bindings/+:
    - {accept: Control+p, send: Page_Up, when: has_menu}
    - {accept: Control+n, send: Page_Down, when: has_menu}
    - {accept: Up, send: Page_Up, when: composing}
    - {accept: Down, send: Page_Down, when: composing}
    - {accept: Release+Escape, set_option: ascii_mode, when: always}
    - {accept: Control+b, send: Up, when: has_menu}
    - {accept: Control+f, send: Down, when: has_menu}
    - {accept: Control+a, send: Home, when: composing}
    - {accept: Control+e, send: End, when: composing}
    - {accept: Control+d, send: Delete, when: composing}
    - {accept: Control+k, send: Shift+Delete, when: composing}
    - {accept: Control+h, send: BackSpace, when: composing}
    - {accept: Control+g, send: Escape, when: composing}
    - {accept: Control+bracketleft, send: Escape, when: composing}
    - {accept: Control+y, send: Page_Up, when: composing}
    - {accept: Alt+v, send: Page_Up, when: composing}
    - {accept: Control+v, send: Page_Down, when: composing}
    - {accept: Control+Shift+1, select: .next, when: always}
    - {accept: Control+Shift+2, toggle: ascii_mode, when: always}
    - {accept: Control+Shift+3, toggle: full_shape, when: always}
    - {accept: Control+Shift+exclam, select: .next, when: always}
    - {accept: Control+Shift+at, toggle: ascii_mode, when: always}
    - {accept: Control+Shift+numbersign, toggle: full_shape, when: always}
